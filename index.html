<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Auto-Ticketing</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <style>
    body {
      background-color: #121212;
      font-family: 'Arial', sans-serif;
      margin-top: 50px;
      margin-left: 150px;
      margin-right: 150px;
      color: #f1f1f1;
    }

    .ticketing {
      background-color: #1e1e1e;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: #f1f1f1;
      text-align: center;
    }

    label {
      font-size: 1rem;
      color: #b5b5b5;
      margin-bottom: 8px;
      display: block;
    }

    input {
      margin-bottom: 20px;
      padding: 10px;
      font-size: 1rem;
      background-color: #2c2c2c;
      border: 1px solid #444;
      border-radius: 4px;
      color: #f1f1f1;
      transition: border-color 0.3s ease;
    }

    input:focus {
      border-color: #00aaff;
      background-color: #333;
      box-shadow: none;
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1.25rem;
      font-weight: bold;
      background-color: #00aaff;
      border: none;
      border-radius: 4px;
      color: #fff;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0088cc;
      cursor: pointer;
    }

    textarea {
      margin-top: 20px;
      background-color: #2c2c2c;
      border: 1px solid #444;
      border-radius: 4px;
      resize: none;
      font-size: 0.9rem;
      color: #f1f1f1;
    }

    hr {
      margin: 40px 0;
      border-color: #444;
    }
  </style>
</head>

<body>
  <div class="ticketing">
    <h1>인터파크 예매</h1>
    <br><br>
    <div class="mb-3">
      <label for="consertId" class="form-label">Consert ID</label>
      <input id="consertId" class="form-control" type="text" placeholder="콘서트 ID" required="required" />
    </div>
    <div class="mb-3">
      <label for="numberPerson">Number of People</label>
      <input id="numberPerson" class="form-control" type="number" placeholder="몇개의 좌석을 원하시나요? (숫자만 입력)"
        required="required" />
    </div>
    <div class="mb-3">
      <label for="day">Day</label>
      <input id="day" class="form-control" type="number" placeholder="원하시는 관람일 (예시 :4월 28일의 경우 28 입력)"
        required="required" />
    </div>
    <div class="mb-3">
      <label for="userId">User ID</label>
      <input id="userId" class="form-control" type="text" placeholder="User ID" required="required" />
    </div>
    <div class="mb-3">
      <label for="password">Password</label>
      <input id="password" class="form-control" type="password" placeholder="Password" required="required" />
    </div>
    <br>
    <button id="ticketing" onclick="start()" class="btn btn-primary btn-block btn-large">
      START
    </button>
    <hr>
    <div class="mb-3">
      <textarea class="form-control" id="logArea" rows="3" disabled></textarea>
    </div>
  </div>
  <script src="./js/function.js" defer></script>
  <script>
    function start() {
      const consertId = document.getElementById('consertId').value;
      const numberPerson = document.getElementById('numberPerson').value;
      const day = document.getElementById('day').value;
      const userId = document.getElementById('userId').value;
      const pw = document.getElementById('password').value;

      startTicketing(consertId, numberPerson, day, userId, pw);
    }
  </script>
</body>

</html>
